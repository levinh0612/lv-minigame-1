<title>Tiệm Bánh Matcha</title>
<meta name="theme-color" content="#FFD6E0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
/* Thiết kế 1a "Kẹo dâu phồng" từ Claude Design: một giao diện sáng, cố ý không đổi theo chế độ tối */
:root{color-scheme:light;
  --bg:#FFF3F6;--ink:#5B3A45;--ink2:#4A3438;--soft:#B0707F;--soft2:#8C6A75;--soft3:#A07A86;
  --pink:#FF7FA1;--pink-d:#E0567A;--pink-m:#FF8FAB;--pink-l:#FFE3EA;--pink-b:#F6DCE3;--sh:#F6CBD7;
  --mint:#8FD9B6;--mint-d:#3F9C78;--mint-l:#DDF4E8;--mint-m:#BFE8D3;--mint-bg:#E3F6EC;
  --gold:#FFD66B;--gold-d:#E8AE2E;--gold-t:#8A6A1F;--cream:#FFF8EC;--lav:#EDE6FF;--lav-d:#7A62C9;--red:#FF6F91;
  --display:"Baloo 2",system-ui,sans-serif;--body:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pink-m);outline-offset:2px}
.scr{max-width:430px;margin:0 auto;min-height:100%;position:relative;display:flex;flex-direction:column;overflow-x:hidden}
.twk{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.twk i{position:absolute;font-style:normal;font-family:Arial,sans-serif;animation:dcTwinkle 3s ease-in-out infinite}
@keyframes dcTwinkle{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes dcFall{0%{transform:translateY(-30px) rotate(0)}100%{transform:translateY(110vh) rotate(620deg)}}
@keyframes dcBurst{0%{transform:translate(0,0) scale(.3);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}
@keyframes dcPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes cakeDrop{0%{transform:translateY(-38px);opacity:0}55%{transform:translateY(0) scale(1.08,.86);opacity:1}78%{transform:scale(.96,1.05)}100%{transform:none}}
@keyframes cakeIdle{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985)}}
@keyframes cakeTw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes cakeHop{0%,100%{transform:translateY(0)}30%{transform:translateY(-10px) scale(1.03,.97)}60%{transform:translateY(0) scale(1.05,.94)}}
@keyframes critWave{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
@keyframes critHeart{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-5px);opacity:.75}}
@keyframes guyBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}

/* nút 3D nảy */
.b3{border-radius:24px;background:var(--pink);color:#fff;font:800 24px var(--display);box-shadow:0 6px 0 var(--pink-d),0 14px 24px -10px rgba(224,86,122,.6);transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .15s,opacity .2s}
.b3:active{transform:translateY(5px) scale(.98);box-shadow:0 1px 0 var(--pink-d)}
.b3.w{background:#fff;color:var(--pink-d);box-shadow:0 5px 0 var(--sh)}
.b3.w:active{box-shadow:0 1px 0 var(--sh)}
.b3:disabled{opacity:.45;cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:99px;padding:6px 14px 6px 8px;box-shadow:0 3px 0 var(--sh);font:800 14px var(--body);white-space:nowrap}
.pill.love{color:var(--pink-d)}
.pill.love span{width:24px;height:24px;border-radius:50%;background:var(--pink-l);display:grid;place-items:center;font-family:Arial,sans-serif}
.pill.coin{color:var(--gold-t);font-variant-numeric:tabular-nums}
.coin-i{width:22px;height:22px;border-radius:50%;background:var(--gold);box-shadow:inset 0 -3px 0 var(--gold-d);flex:none}
.rbtn{width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 3px 0 var(--sh);display:grid;place-items:center;font:800 15px Arial,sans-serif;color:var(--soft);transition:transform .15s cubic-bezier(.34,1.56,.64,1)}
.rbtn:active{transform:translateY(3px)}

/* ===== Bắt đầu ===== */
.awn{height:34px;background:repeating-linear-gradient(90deg,var(--pink-m) 0 39px,var(--cream) 39px 78px);flex:none}
.awn2{height:20px;margin-top:-1px;background-image:radial-gradient(circle at 19.5px 0,var(--pink-m) 19px,transparent 19.5px),radial-gradient(circle at 58.5px 0,var(--cream) 19px,transparent 19.5px);background-size:78px 20px;filter:drop-shadow(0 3px 0 rgba(224,86,122,.18));flex:none}
.hrow{display:flex;align-items:center;gap:8px;padding:12px 20px 0;position:relative;z-index:2}
.hrow .sp{flex:1}
.title{text-align:center;padding-top:22px;display:flex;flex-direction:column;align-items:center;position:relative;z-index:2}
.title .t1{font:700 22px var(--display);color:var(--mint-d);letter-spacing:1px}
.title .t2{font:800 64px/.9 var(--display);color:var(--pink-d);text-shadow:0 4px 0 #fff,0 7px 0 #F7BFCD}
.title .t3{font:700 15px var(--body);color:var(--soft);margin-top:10px}
.evt{margin:14px 20px 0;background:linear-gradient(135deg,#FFE3EA,#FFF0C9);border-radius:22px;padding:12px 16px;box-shadow:0 4px 0 var(--sh);position:relative;z-index:2}
.evt b{display:block;font:800 16px var(--display);color:var(--pink-d)}
.evt p{margin:2px 0 0;font:600 13px/1.4 var(--body);color:var(--soft2);white-space:pre-line}
.yard{margin:18px 20px 0;height:190px;border-radius:32px;background:var(--mint-l);position:relative;display:flex;align-items:flex-end;justify-content:center;gap:10px;padding-bottom:18px;box-shadow:inset 0 -26px 0 var(--mint-m);z-index:2}
.yard .win{position:absolute;top:18px;left:22px;width:62px;height:46px;border-radius:14px;background:#fff;box-shadow:0 0 0 5px #FFD1DC}
.yard .sign{position:absolute;top:26px;right:26px;font:800 13px var(--body);color:var(--mint-d);background:#fff;padding:4px 10px;border-radius:10px;transform:rotate(4deg)}
.pet{display:flex;flex-direction:column;align-items:center;gap:4px;touch-action:manipulation}
.pet.mid{margin-bottom:10px}
.pet small{font:800 12px var(--body);color:var(--mint-d)}
.squish>svg{animation:squish .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes squish{30%{transform:scale(1.12,.86)}60%{transform:scale(.94,1.08)}}
.letter{margin:16px 20px 0;background:#fff;border-radius:24px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 0 var(--sh);text-align:left;width:calc(100% - 40px);transition:transform .2s cubic-bezier(.34,1.56,.64,1);position:relative;z-index:2}
.letter:active{transform:translateY(-2px) rotate(-1deg)}
.env{width:52px;height:38px;border-radius:8px;background:#FFB3C7;position:relative;overflow:hidden;flex:none}
.env::before{content:"";position:absolute;left:7.5px;top:-19px;width:37px;height:38px;background:var(--pink-m);transform:scaleY(.9) rotate(45deg);border-radius:6px}
.env::after{content:"";position:absolute;left:21px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--pink-d)}
.letter .tx{flex:1;display:flex;flex-direction:column;gap:2px}
.letter .tx b{font:800 16px var(--body)}
.letter .tx small{font:600 13px var(--body);color:var(--soft)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px var(--pink-l);flex:none}
.grow{flex:1;min-height:16px}
.openw{padding:0 20px;position:relative;z-index:2}
.openw .b3{width:100%;height:66px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:18px 20px calc(22px + env(safe-area-inset-bottom,0px));position:relative;z-index:2}
.nav button{display:flex;flex-direction:column;align-items:center;gap:6px;font:800 12px var(--body);color:var(--soft2)}
.nav .ic{width:54px;height:54px;border-radius:20px;display:grid;place-items:center;font:800 22px Arial,sans-serif;transition:transform .2s cubic-bezier(.34,1.56,.64,1);position:relative}
.nav button:active .ic{transform:translateY(3px) scale(.95)}
.nav .ic.new::after{content:"";position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid #fff}

/* ===== Chơi ===== */
.play{height:100vh;height:100dvh;overflow:hidden}
.ptop{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 8px;flex:none}
.lv{width:44px;height:44px;border-radius:50%;background:var(--pink);color:#fff;font:800 16px var(--display);display:grid;place-items:center;box-shadow:0 3px 0 var(--pink-d);flex:none}
.pbar{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.pbar small{font:800 12px var(--body);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:10px;border-radius:10px;background:#FFDCE5;overflow:hidden}
.track i{display:block;height:100%;border-radius:10px;background:var(--pink-m);transition:width .4s}
.pill.sm{padding:5px 10px 5px 5px;font-size:13px}
.pill.sm .coin-i{width:18px;height:18px;box-shadow:inset 0 -2px 0 var(--gold-d)}
.pill.pulse{animation:dcPop .35s ease-out}
.lane{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 12px 0;flex:none}
.seat{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;min-width:0}
.ord{background:#fff;border-radius:16px;padding:6px 5px;height:84px;width:100%;box-shadow:0 3px 0 var(--sh);display:flex;flex-direction:column;justify-content:center;gap:1px;font:700 11px/1.25 var(--body);color:var(--ink);text-align:center;border:2px solid transparent;transition:border-color .2s,background .2s}
.ord .rn{font:900 12px/1.15 var(--body);color:var(--ink)}
.ord .sw{color:var(--pink-d);font-weight:800}
.seat.tgt .ord{border-color:var(--pink-m)}
.seat.low .ord{background:#FFF4F4;box-shadow:0 3px 0 #F6C0C0}
.ord.ok{background:var(--mint-d);color:#fff;border-color:var(--mint-d);font:800 12px var(--body);animation:dcPop .35s ease-out}
.ord.ok small{font:700 11px var(--body);opacity:.9}
.who-art{height:86px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.who-art button{display:flex;align-items:flex-end}
.seat .pat{width:80%;height:8px;border-radius:8px;background:var(--pink-l);overflow:hidden}
.seat .pat i{display:block;height:100%;width:100%;border-radius:8px;background:var(--mint);transform-origin:left center;will-change:transform;transition:background .3s}
.seat .nm{font:800 12px var(--body);color:var(--soft2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.seat.enter .who-art{animation:walkin .75s ease-out}
.seat.enter .ord,.seat.enter .nm,.seat.enter .pat{animation:dcPop .35s ease-out .55s both}
@keyframes walkin{0%{transform:translateX(-70px);opacity:0}20%{opacity:1}25%{transform:translateX(-52px) translateY(-7px)}50%{transform:translateX(-30px)}75%{transform:translateX(-12px) translateY(-7px)}100%{transform:none}}
.seat.low .who-art svg{animation:fidget .3s ease-in-out infinite alternate}
@keyframes fidget{from{transform:rotate(-3deg)}to{transform:rotate(3deg) translateY(-2px)}}
.seat.bye{animation:bye .5s ease-in forwards}
@keyframes bye{to{transform:translateX(50px);opacity:0}}
.burst{position:absolute;left:50%;top:110px;width:0;height:0;pointer-events:none;z-index:6}
.burst i{position:absolute;left:-9px;top:-12px;font-style:normal;font-family:Arial,sans-serif;animation:dcBurst 1s cubic-bezier(.2,.8,.3,1) forwards}
.ctr{margin-top:10px;height:12px;background:#F3C7A4;box-shadow:0 4px 0 #E2AE86;flex:none}
.bench{height:128px;display:flex;align-items:center;justify-content:center;gap:18px;background:var(--cream);flex:none;padding:0 12px}
.bench .for{display:flex;flex-direction:column;gap:3px;min-width:0;max-width:170px}
.bench .for small{font:800 12px var(--body);color:var(--soft)}
.bench .for b{font:800 18px/1 var(--display);color:var(--ink)}
.bench .for .rc{font:800 13px/1.2 var(--body);color:var(--mint-d)}
.bench .for .sw{font:700 12px var(--body);color:var(--pink-d)}
.sheet{flex:1;min-height:0;background:#fff;border-radius:30px 30px 0 0;padding:16px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:9px;box-shadow:0 -6px 20px -12px rgba(224,86,122,.4);overflow-y:auto}
.crow{display:flex;align-items:center;gap:8px}
.crow>span{width:58px;font:900 13px var(--body);color:var(--soft);flex:none}
.crow .g3{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.chip{display:flex;align-items:center;gap:6px;padding:7px 6px;border-radius:16px;border:2px solid var(--pink-b);background:#fff;font:800 12px var(--body);color:var(--ink);transition:transform .2s cubic-bezier(.34,1.56,.64,1),background .2s,border-color .2s;min-width:0;text-align:left;line-height:1.1;position:relative}
.chip:active{transform:scale(.9)}
.chip i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12),0 0 0 1.5px #F2D3DB;flex:none}
.chip.sq i{border-radius:6px}
.chip.on{border-color:var(--pink-m);background:var(--pink-l)}
.chip.ok{border-color:var(--mint);background:var(--mint-bg)}
.chip.bad{border-color:var(--red);background:#FFF4F4}
.chip em{position:absolute;right:-5px;top:-7px;width:18px;height:18px;border-radius:50%;font:900 11px/18px Arial,sans-serif;text-align:center;color:#fff;font-style:normal}
.chip.ok em{background:var(--mint-d)}.chip.bad em{background:var(--red)}
.give{height:58px;flex:none;border-radius:22px;font-size:21px;box-shadow:0 6px 0 var(--pink-d)}
.pbtn{position:absolute;right:14px;top:calc(62px + env(safe-area-inset-top,0px));z-index:5}

/* ===== Kết quả ===== */
body[data-scr="result"]{background:var(--pink-l)}
.res{background:var(--pink-l);align-items:center;min-height:100vh;min-height:100dvh;overflow:hidden}
.conf{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.conf i{position:absolute;top:-20px;animation:dcFall 4s linear infinite}
.res .hd{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;padding-top:calc(48px + env(safe-area-inset-top,0px));width:100%}
.res .hd small{font:800 16px var(--body);color:var(--soft)}
.res .hd h1{margin:0;font:800 44px/1 var(--display);color:var(--pink-d);text-shadow:0 4px 0 #fff}
.stars{display:flex;align-items:flex-end;gap:4px;margin-top:14px;font-family:Arial,sans-serif}
.stars span{color:#FFC94D;text-shadow:0 4px 0 #E8A92A;animation:dcPop .5s ease-out both}
.stars span.off{color:#F6D3DC;text-shadow:0 4px 0 #EDB9C6}
.stars span:nth-child(1){font-size:58px;transform:rotate(-12deg)}
.stars span:nth-child(2){font-size:78px;margin-bottom:10px;animation-delay:.15s}
.stars span:nth-child(3){font-size:58px;transform:rotate(12deg);animation-delay:.3s}
.rcard{position:relative;z-index:2;margin:74px 20px 0;align-self:stretch;background:#fff;border-radius:32px;padding:54px 18px 18px;box-shadow:0 6px 0 var(--sh);display:flex;flex-direction:column;gap:14px}
.rcard .mas{position:absolute;top:-62px;left:50%;transform:translateX(-50%)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp div{border-radius:18px;padding:10px 6px;text-align:center}
.kp b{display:block;font:800 22px var(--display);font-variant-numeric:tabular-nums}
.kp small{font:700 12px var(--body);color:var(--soft3)}
.gl{display:flex;flex-direction:column;gap:8px}
.gl h4{margin:0;font:900 13px var(--body);color:var(--soft)}
.gi{display:flex;align-items:center;gap:10px;font:700 14px var(--body);color:var(--ink)}
.gi .ck{width:22px;height:22px;border-radius:50%;border:2.5px solid #F2D3DB;flex:none;display:grid;place-items:center;font:900 13px Arial,sans-serif;color:#fff}
.gi.done .ck{background:var(--mint);border-color:var(--mint)}
.gi:not(.done){color:#B9A0A8}
.gi .gv{margin-left:auto;font:800 12px var(--body);color:var(--soft);font-variant-numeric:tabular-nums}
.unlock{background:var(--bg);border:2px dashed #FFB3C7;border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.unlock .env{width:44px;height:32px}
.unlock b{display:block;font:800 14px var(--body)}
.unlock small{font:600 12px var(--body);color:var(--soft)}
.lvup{background:linear-gradient(135deg,#FFF0C9,#FFE3EA);border-radius:18px;padding:10px 14px;font:800 14px var(--body);color:var(--ink);text-align:center}
.rbtns{position:relative;z-index:2;display:flex;gap:10px;padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px));align-self:stretch;margin-top:auto}
.rbtns .b3{height:60px;font-size:18px;border-radius:22px}

/* ===== Cửa hàng & các trang phụ ===== */
.shead{display:flex;align-items:center;gap:10px;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 12px}
.shead h2{margin:0;flex:1;font:800 28px/1.1 var(--display);color:var(--ink)}
.room{margin:0 20px;height:200px;border-radius:30px;overflow:hidden;position:relative;background:#FFD9E3;background-image:radial-gradient(#FFF 2.5px,transparent 3px);background-size:22px 22px;flex:none}
.room .floor{position:absolute;left:0;right:0;bottom:0;height:70px;background:repeating-linear-gradient(90deg,#C9EEDB 0 30px,#BDE8D2 30px 60px)}
.room .rwin{position:absolute;left:24px;top:22px;width:92px;height:72px;border-radius:46px 46px 10px 10px;background:#E4F5FF;box-shadow:0 0 0 6px #fff}
.room .board{position:absolute;right:30px;top:24px;width:70px;height:54px;border-radius:8px;background:#5E6F5B;box-shadow:0 0 0 5px #D9A66B;display:grid;place-items:center;font:700 11px/1.2 var(--body);color:#fff;text-align:center}
.room .pets{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:26px;align-items:flex-end;z-index:3}
.room .d{position:absolute}
.seg{margin:16px 20px 0;background:#fff;border-radius:18px;padding:5px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;box-shadow:0 3px 0 var(--sh)}
.seg button{text-align:center;padding:9px 0;border-radius:14px;color:var(--soft);font:800 14px var(--body);transition:background .2s}
.seg button.on{background:var(--pink);color:#fff}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.item{background:#fff;border-radius:24px;padding:10px 10px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 0 var(--sh)}
.item.lock{opacity:.75}
.item .pv{height:88px;border-radius:18px;position:relative;overflow:hidden}
.item b{font:800 14px var(--body)}
.item small{font:600 11.5px/1.3 var(--body);color:var(--soft3);margin-top:-4px}
.tag{font:800 13px var(--body);border-radius:12px;padding:6px 0;text-align:center}
.tag.use{color:var(--mint-d);background:var(--mint-bg)}
.tag.lk{color:#9A86C9;background:#F3EEFF}
.buy{font:800 13px var(--body);color:#fff;background:var(--pink);border-radius:12px;padding:7px 0;box-shadow:0 3px 0 var(--pink-d);transition:transform .15s cubic-bezier(.34,1.56,.64,1)}
.buy:active{transform:translateY(3px) scale(.96)}
.buy:disabled{opacity:.45}
.list{padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border-radius:24px;padding:14px 16px;box-shadow:0 4px 0 var(--sh)}
.card h3{margin:0 0 8px;font:800 18px var(--display);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3 small{font:700 12px var(--body);color:var(--soft)}
.pcard{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.pcard .nm{font:800 18px var(--display)}
.pcard .ds{font:600 12.5px/1.35 var(--body);color:var(--soft3)}
.hearts{color:var(--red);letter-spacing:2px;font:800 14px Arial,sans-serif;margin:4px 0}
.mini{font:800 13px var(--body);color:#fff;background:var(--mint-d);border-radius:12px;padding:7px 14px;box-shadow:0 3px 0 #2E7A5C;transition:transform .15s}
.mini:active{transform:translateY(3px)}
.mini:disabled{background:#D9CDD1;box-shadow:0 3px 0 #C4B5BA}

const sparkle = (x,y,s,delay,dur) => `<path d="M${x} ${y} l${1.8*s} ${-4.6*s} l${1.8*s} ${4.6*s} l${4.6*s} ${1.8*s} l${-4.6*s} ${1.8*s} l${-1.8*s} ${4.6*s} l${-1.8*s} ${-4.6*s} l${-4.6*s} ${-1.8*s} Z" style="transform-box:fill-box;transform-origin:center;animation:cakeTw ${dur||1.8}s ease-in-out ${delay||0}s infinite"/>`;
const heartP = (x,y,delay) => `<path d="M${x+6} ${y} C${x+6} ${y-4} ${x+1} ${y-5} ${x} ${y-1} C${x-1} ${y-5} ${x-6} ${y-4} ${x-6} ${y} C${x-6} ${y+4} ${x} ${y+7} ${x} ${y+9} C${x} ${y+7} ${x+6} ${y+4} ${x+6} ${y} Z" style="transform-box:fill-box;transform-origin:center;animation:cakeTw 1.4s ease-in-out ${delay}s infinite"/>`;
const CREAM_P = `<path d="M18 80 C18 64 40 56 70 56 C100 56 122 64 122 80 C116 80 116 86 110 86 C104 86 104 80 98 80 C92 80 94 88 86 88 C80 88 80 80 74 80 H66 C60 80 60 86 54 86 C48 86 48 80 42 80 C36 80 36 86 30 86 C24 86 24 80 18 80 Z" fill="%C"/><path d="M50 60 C48 46 58 38 70 38 C82 38 92 46 90 60 Z" fill="%C"/><path d="M57 50 C64 46 76 46 83 50" stroke-width="2"/>`;
const STRAW = `<path d="M70 42 C58 42 56 28 62 21 C66 17 74 17 78 21 C84 28 82 42 70 42 Z" fill="#F0506E"/><path d="M62 21 L65 14 L70 19 L75 14 L78 21 Z" fill="#7FB77E" stroke-width="2.2"/>`;
const NUT = `<path d="M70 16 C62 24 57 31 57 38 C57 45 83 45 83 38 C83 31 78 24 70 16 Z" fill="#B07A4A"/>`;
// p: {base,cream,top,sweet} chỉ số -1..2; o: {size, done, drop: phần vừa thêm (chỉ phần đó rơi xuống), still: không động}
function cakeSVG(p, o){
  o = o || {};
  const S = o.size || 140, b = p.base ?? -1, c = p.cream ?? -1, t = p.top ?? -1, s = p.sweet ?? -1, done = !!o.done;
  const drop = k => o.drop === k ? ` style="transform-box:fill-box;transform-origin:50% 100%;animation:cakeDrop .55s cubic-bezier(.3,1.4,.5,1) both"` : "";
  const body = o.still ? "" : `transform-box:fill-box;transform-origin:50% 100%;animation:${done ? "cakeHop .8s cubic-bezier(.3,1.4,.5,1) infinite" : "cakeIdle 2.8s ease-in-out infinite"}`;
  let g = "";
  if (b===0) g += `<g${drop("base")}><rect x="22" y="74" width="96" height="34" rx="10" fill="#F6D59A"/><g fill="#E6B870" stroke="none"><circle cx="34" cy="100" r="2.4"/><circle cx="106" cy="99" r="2"/><circle cx="40" cy="86" r="1.8"/><circle cx="100" cy="86" r="2.2"/></g></g>`;
  if (b===1) g += `<g${drop("base")}><path d="M16 76 H124 L114 108 H26 Z" fill="#D9A66B"/><path d="M30 80 L33 104 M44 80 L46 104 M96 80 L94 104 M110 80 L107 104" stroke="#B98246" stroke-width="2.2"/></g>`;
  if (b===2) g += `<g${drop("base")}><path d="M22 108 C20 82 40 70 70 70 C100 70 120 82 118 108 Z" fill="#FFF4EE"/><g fill="#F1DDD5" stroke="none"><circle cx="36" cy="96" r="1.8"/><circle cx="104" cy="94" r="1.8"/><circle cx="44" cy="84" r="1.4"/><circle cx="98" cy="84" r="1.4"/></g></g>`;
  if (b>=0){
    g += `<ellipse cx="50" cy="100" rx="4.6" ry="2.6" fill="#FF9FB6" stroke="none" opacity=".8"/><ellipse cx="90" cy="100" rx="4.6" ry="2.6" fill="#FF9FB6" stroke="none" opacity=".8"/>`;
    g += done ? `<path d="M54 97 Q58 92 62 97 M78 97 Q82 92 86 97" stroke-width="2.2"/>`
              : `<circle cx="58" cy="96" r="3.4" fill="${INK}" stroke="none"/><circle cx="59.2" cy="94.8" r="1.2" fill="#fff" stroke="none"/><circle cx="82" cy="96" r="3.4" fill="${INK}" stroke="none"/><circle cx="83.2" cy="94.8" r="1.2" fill="#fff" stroke="none"/>`;
    g += `<path d="M66 100 Q70 104 74 100" stroke-width="2.2"/>`;
  }
  if (c>=0) g += `<g${drop("cream")}>${CREAM_P.replace(/%C/g, CATS.cream[c][1])}</g>`;
  if (t===0) g += `<g${drop("top")}>${STRAW}<g fill="#FFE08A" stroke="none"><ellipse cx="65" cy="28" rx="1.2" ry="1.8"/><ellipse cx="75" cy="28" rx="1.2" ry="1.8"/><ellipse cx="70" cy="34" rx="1.2" ry="1.8"/></g><g transform="translate(34 62) scale(.55) translate(-70 -30)" stroke-width="4.4">${STRAW}</g><g transform="translate(106 62) scale(.55) translate(-70 -30)" stroke-width="4.4">${STRAW}</g></g>`;
  if (t===1) g += `<g${drop("top")} fill="#8E3B46" stroke-width="2"><ellipse cx="60" cy="38" rx="5.5" ry="4.2"/><ellipse cx="72" cy="32" rx="5.5" ry="4.2" transform="rotate(-15 72 32)"/><ellipse cx="81" cy="40" rx="5.5" ry="4.2" transform="rotate(20 81 40)"/><ellipse cx="68" cy="42" rx="5.5" ry="4.2"/><ellipse cx="34" cy="64" rx="4.5" ry="3.4"/><ellipse cx="44" cy="60" rx="4.5" ry="3.4"/><ellipse cx="96" cy="60" rx="4.5" ry="3.4"/><ellipse cx="106" cy="64" rx="4.5" ry="3.4"/><g fill="#fff" stroke="none" opacity=".8"><circle cx="58.5" cy="36.5" r="1.2"/><circle cx="70.5" cy="30.5" r="1.2"/><circle cx="79.5" cy="38.5" r="1.2"/></g></g>`;
  if (t===2) g += `<g${drop("top")}>${NUT}<path d="M58.5 37 C60 43 80 43 81.5 37 C76 40.5 64 40.5 58.5 37 Z" fill="#E8C9A0" stroke-width="2"/><path d="M66 24 C64 27 63 30 63 32" stroke="#D4A472" stroke-width="2.2"/><g transform="translate(36 62) scale(.55) translate(-70 -32)" stroke-width="4.4">${NUT}</g><g transform="translate(104 62) scale(.55) translate(-70 -32)" stroke-width="4.4">${NUT}</g></g>`;
  if (s===2) g += `<path d="M26 72 C38 67 46 76 56 71 C66 66 76 76 86 71 C96 66 104 74 114 69" stroke="#E8A92A" stroke-width="3.6" style="animation:cakeDrop .5s ease-out both"/>`;
  let out = `<ellipse cx="70" cy="110" rx="62" ry="8" fill="#FFFFFF"/>`;
  if (b<0) out += `<path d="M24 108 C22 82 42 66 70 66 C98 66 118 82 116 108 Z" stroke="#D9C4CB" stroke-dasharray="6 6"/>`;
  out += `<g style="${body}">${g}</g>`;
  if (s>=0){
    out += `<g fill="#FFD166" stroke-width="1.6">${sparkle(104,44,1)}`;
    if (s>=1) out += sparkle(28,48,1,-.9);
    if (s>=2) out += sparkle(44,26,.78,-.4) + sparkle(94,22,.78,-1.3);
    out += `</g>`;
  }
  if (done) out += `<g fill="#FF8FAB" stroke-width="1.6"><g fill="#FFD166">${sparkle(14,60,1.3,0,1.2)}${sparkle(122,70,1.3,-.6,1.2)}</g>${heartP(110,29,-.3)}${heartP(24,25,-1)}</g>`;
  return `<svg width="${S}" height="${Math.round(S*114/140)}" viewBox="0 6 140 114" style="display:block;overflow:visible;flex:none" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">${out}</svg>`;
}

let CID = 0;
// p: {kind,fur,pattern,mark,ear,fluffy,bow,mood,wave,ledge}
function critterSVG(p, S){
  S = S || 90;
  const k = p.kind || "cat", fur = p.fur || "#FFFFFF", mood = p.mood || "happy", pattern = p.pattern || "none", mark = p.mark || "#E9A860", wave = !!p.wave;
  const vbY = k==="bunny" ? -18 : 12, vbH = 98 - vbY, cid = "cr" + (++CID);
  const open = mood==="open" || mood==="impatient", happy = mood==="happy" || mood==="love";
  const headFill = pattern==="tux" ? mark : fur, earL = headFill, earR = (pattern==="tux"||pattern==="patch") ? mark : fur;
  const pawFill = pattern==="tux" ? "#FFFFFF" : fur, blush = mood==="impatient" ? .3 : .75;
  let s = `<defs><clipPath id="${cid}"><path d="M12 94 C10 58 18 36 60 36 C102 36 110 58 108 94 Z"/></clipPath></defs>`;
  if (k==="cat") s += `<path d="M18 60 L22 18 L52 40 Z" fill="${earL}"/><path d="M27 46 L28 28 L43 40 Z" fill="#F7A8B8" stroke="none"/><path d="M102 60 L98 18 L68 40 Z" fill="${earR}"/><path d="M93 46 L92 28 L77 40 Z" fill="#F7A8B8" stroke="none"/>`;
  if (k==="bunny") s += `<path d="M36 44 C28 18 30 -12 42 -14 C54 -14 54 20 50 40 Z" fill="${fur}"/><path d="M41 34 C37 18 38 -4 42 -6 C46 -6 47 16 46 32 Z" fill="#F7A8B8" stroke="none"/><path d="M84 44 C92 18 90 -12 78 -14 C66 -14 66 20 70 40 Z" fill="${fur}"/><path d="M79 34 C83 18 82 -4 78 -6 C74 -6 73 16 74 32 Z" fill="#F7A8B8" stroke="none"/>`;
  if (k==="bear") s += `<circle cx="28" cy="44" r="13" fill="${fur}"/><circle cx="28" cy="44" r="6" fill="#F7A8B8" stroke="none"/><circle cx="92" cy="44" r="13" fill="${fur}"/><circle cx="92" cy="44" r="6" fill="#F7A8B8" stroke="none"/>`;
  if (p.fluffy) s += `<circle cx="32" cy="44" r="13" fill="${fur}"/><circle cx="47" cy="34" r="14" fill="${fur}"/><circle cx="64" cy="31" r="14" fill="${fur}"/><circle cx="81" cy="36" r="13" fill="${fur}"/><circle cx="91" cy="46" r="11" fill="${fur}"/>`;
  s += `<path d="M12 94 C10 58 18 36 60 36 C102 36 110 58 108 94 Z" fill="${headFill}"/><g clip-path="url(#${cid})" stroke="none">`;
  if (pattern==="tux") s += `<path d="M60 54 C46 54 38 70 30 96 L90 96 C82 70 74 54 60 54 Z" fill="${fur}"/><path d="M60 38 L60 54" stroke="${fur}" stroke-width="6"/>`;
  if (pattern==="patch") s += `<circle cx="94" cy="48" r="24" fill="${mark}"/><circle cx="18" cy="88" r="12" fill="${p.mark2||"#5A4A48"}"/>`;
  if (pattern==="tabby") s += `<path d="M51 41 L53 50 M60 39 V50 M69 41 L67 50 M11 62 L22 64 M11 70 L21 71 M109 62 L98 64 M109 70 L99 71" stroke="${mark}" stroke-width="3.6"/>`;
  s += `</g><path d="M12 94 C10 58 18 36 60 36 C102 36 110 58 108 94" fill="none"/>`;
  if (k==="dog") s += `<path d="M24 44 C8 42 2 66 8 78 C14 88 28 74 32 52 Z" fill="${p.ear||"#E8D8CC"}"/><path d="M96 44 C112 42 118 66 112 78 C106 88 92 74 88 52 Z" fill="${p.ear||"#E8D8CC"}"/>`;
  if (k==="cat") s += `<path d="M14 70 L2 67 M14 76 L3 78 M106 70 L118 67 M106 76 L117 78" stroke-width="2"/>`;
  s += `<ellipse cx="31" cy="77" rx="6.5" ry="3.8" fill="#FF9FB6" stroke="none" opacity="${blush}"/><ellipse cx="89" cy="77" rx="6.5" ry="3.8" fill="#FF9FB6" stroke="none" opacity="${blush}"/>`;
  const eyeO = (x) => `<circle cx="${x}" cy="67" r="6.8" fill="${INK}" stroke="none"/><circle cx="${x+2.3}" cy="64.4" r="2.4" fill="#fff" stroke="none"/>`;
  if (open || mood==="wink") s += eyeO(42);
  if (happy) s += `<path d="M35 68 Q42 60 49 68"/>`;
  if (open) s += eyeO(78);
  if (happy) s += `<path d="M71 68 Q78 60 85 68"/>`;
  if (mood==="wink") s += `<path d="M84 63 L73 67.5 L84 72"/>`;
  if (mood==="impatient") s += `<path d="M34 57 L46 54 M86 57 L74 54" stroke-width="2.4"/><path d="M104 42 C99 49 99 55 104 55 C109 55 109 49 104 42 Z" fill="#A8DDF5" stroke-width="2"/>`;
  s += `<ellipse cx="60" cy="72" rx="3.2" ry="2.2" fill="${k==="dog"||k==="bear" ? INK : "#F48FA8"}" stroke="none"/>`;
  if (mood==="love"||mood==="wink") s += `<path d="M55.5 76.5 Q60 86 64.5 76.5 Z" fill="#F07A95" stroke-width="2"/>`;
  s += mood!=="impatient" ? `<path d="M53 75 Q56.5 80 60 75 Q63.5 80 67 75" stroke-width="2.4"/>` : `<path d="M54 80 Q60 75 66 80" stroke-width="2.4"/>`;
  if (p.bow) s += `<g transform="translate(30 38) rotate(-18)"><path d="M0 0 L-12 -8 L-12 8 Z M0 0 L12 -8 L12 8 Z" fill="${p.bow}" stroke-width="2.2"/><circle r="4" fill="${p.bow}" stroke-width="2.2"/></g>`;
  if (mood==="love") s += `<g style="animation:critHeart 1.6s ease-in-out infinite"><path d="M106 24 C106 19 100 18 99 23 C98 18 92 19 92 24 C92 29 99 32 99 35 C99 32 106 29 106 24 Z" fill="#FF6F91" stroke-width="2"/></g>`;
  s += `<path d="M28 95 C27 85 45 85 44 95 Z" fill="${pawFill}"/><path d="M34 90 V94 M38.5 90 V94" stroke-width="2"/>`;
  if (!wave) s += `<path d="M76 95 C75 85 93 85 92 95 Z" fill="${pawFill}"/><path d="M82 90 V94 M86.5 90 V94" stroke-width="2"/>`;
  else s += `<g style="transform-origin:100px 94px;animation:critWave 1.4s ease-in-out infinite"><path d="M90 95 C90 78 92 62 94 55 C96 45 112 45 112 57 C112 68 108 82 108 95" fill="${pawFill}"/><ellipse cx="102.5" cy="60" rx="4.6" ry="3.8" fill="#F7A8B8" stroke="none"/><circle cx="97" cy="52.5" r="1.9" fill="#F7A8B8" stroke="none"/><circle cx="102.5" cy="50.5" r="1.9" fill="#F7A8B8" stroke="none"/><circle cx="108" cy="52.5" r="1.9" fill="#F7A8B8" stroke="none"/></g>`;
  if (p.ledge !== false) s += `<path d="M-6 95 H126"/>`;
  return `<svg width="${S}" height="${Math.round(S*vbH/120)}" viewBox="0 ${vbY} 120 ${vbH}" style="display:block;overflow:visible;flex:none" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">${s}</svg>`;
}

// p: {gender,hairStyle,hair,skin,accent,gesture,mood,ledge}
function guestSVG(p, S){
  S = S || 90;
  const girl = (p.gender||"girl")==="girl", mood = p.mood||"happy", g = p.gesture||"rest", style = p.hairStyle || (girl?"long":"short");
  const hair = p.hair || (girl?"#6B4A3A":"#3B2A26"), skin = p.skin || "#FFE3D0", acc = p.accent || "#FF8FAB";
  const open = mood==="open"||mood==="impatient", happy = mood==="happy"||mood==="love", blush = mood==="impatient" ? .3 : .75;
  let s = "";
  if (girl && style==="buns") s += `<circle cx="24" cy="28" r="13" fill="${hair}"/><circle cx="96" cy="28" r="13" fill="${hair}"/>`;
  if (girl && style==="long") s += `<path d="M8 97 C4 44 28 18 60 18 C92 18 116 44 112 97 Z" fill="${hair}"/>`;
  if ((girl && style==="buns") || !girl) s += `<path d="M16 74 C12 36 34 20 60 20 C86 20 108 36 104 74 Z" fill="${hair}"/>`;
  if (!girl) s += `<circle cx="19" cy="72" r="7" fill="${skin}"/><circle cx="101" cy="72" r="7" fill="${skin}"/>`;
  s += `<path d="M20 97 C16 62 30 40 60 40 C90 40 104 62 100 97 Z" fill="${skin}"/>`;
  if (girl) s += `<path d="M20 64 C18 34 40 24 60 24 C80 24 102 34 100 64 C94 56 88 48 84 42 C78 52 68 56 60 50 C52 56 42 56 36 46 C30 54 25 58 20 64 Z" fill="${hair}"/>`;
  if (!girl && style!=="cap") s += `<path d="M17 66 C14 34 38 20 60 20 C84 20 106 34 103 66 C98 56 94 50 90 44 C86 52 78 53 73 45 C67 53 59 53 55 45 C49 53 41 53 37 45 C31 51 23 58 17 66 Z" fill="${hair}"/><path d="M58 21 C55 12 62 7 68 10"/>`;
  if (!girl && style==="cap") s += `<path d="M17 58 C17 26 38 15 60 15 C82 15 103 26 103 58 Z" fill="${acc}"/><path d="M14 58 C40 51 80 51 106 58 C106 65 14 65 14 58 Z" fill="${acc}"/><circle cx="60" cy="16" r="3.2" fill="${acc}"/><path d="M20 64 C22 60 28 60 30 64 M90 64 C92 60 98 60 100 64" fill="${hair}" stroke-width="2"/>`;
  if (girl && style==="long") s += `<g transform="translate(86 32) rotate(18)"><path d="M0 0 L-11 -8 L-11 8 Z M0 0 L11 -8 L11 8 Z" fill="${acc}" stroke-width="2.2"/><circle r="3.8" fill="${acc}" stroke-width="2.2"/></g>`;
  s += `<ellipse cx="30" cy="81" rx="6.5" ry="3.8" fill="#FF9FB6" stroke="none" opacity="${blush}"/><ellipse cx="90" cy="81" rx="6.5" ry="3.8" fill="#FF9FB6" stroke="none" opacity="${blush}"/>`;
  const eyeO = x => `<circle cx="${x}" cy="71" r="6.6" fill="${INK}" stroke="none"/><circle cx="${x+2.2}" cy="68.4" r="2.3" fill="#fff" stroke="none"/>`;
  if (open || mood==="wink") s += eyeO(43);
  if (happy) s += `<path d="M36 72 Q43 64 50 72"/>`;
  if (open) s += eyeO(77);
  if (happy) s += `<path d="M70 72 Q77 64 84 72"/>`;
  if (mood==="wink") s += `<path d="M83 67 L72 71.5 L83 76"/>`;
  if (girl && (open || mood==="wink")) s += `<path d="M35 66 L32 63 M85 66 L88 63" stroke-width="2.2"/>`;
  if (mood==="impatient") s += `<path d="M35 61 L48 58 M85 61 L72 58" stroke-width="2.4"/><path d="M106 46 C101 53 101 59 106 59 C111 59 111 53 106 46 Z" fill="#A8DDF5" stroke-width="2"/>`;
  if (mood==="love"||mood==="wink") s += `<path d="M54.5 80 Q60 90 65.5 80 Z" fill="#F07A95" stroke-width="2.2"/>`;
  if (mood==="happy"||mood==="open") s += `<path d="M55 81 Q60 86 65 81" stroke-width="2.4"/>`;
  if (mood==="impatient") s += `<path d="M55 85 Q60 80 65 85" stroke-width="2.4"/>`;
  if (mood==="love") s += `<g style="animation:critHeart 1.6s ease-in-out infinite"><path d="M110 28 C110 23 104 22 103 27 C102 22 96 23 96 28 C96 33 103 36 103 39 C103 36 110 33 110 28 Z" fill="#FF6F91" stroke-width="2"/></g>`;
  if (g==="rest") s += `<path d="M28 98 C27 87 45 87 44 98 Z" fill="${skin}"/><path d="M76 98 C75 87 93 87 92 98 Z" fill="${skin}"/>`;
  if (g==="wave") s += `<path d="M28 98 C27 87 45 87 44 98 Z" fill="${skin}"/><g style="transform-origin:99px 98px;animation:critWave 1.4s ease-in-out infinite"><path d="M89 98 L92 68 L107 68 L110 98 Z" fill="${acc}"/><circle cx="99.5" cy="60" r="10" fill="${skin}"/><path d="M95 54 V57 M100 52.5 V56 M105 54 V57" stroke-width="1.8"/></g>`;
  if (g==="cheek") s += `<path d="M10 98 C10 90 30 88 31 98 Z" fill="${acc}"/><circle cx="23" cy="86" r="9" fill="${skin}"/><path d="M110 98 C110 90 90 88 89 98 Z" fill="${acc}"/><circle cx="97" cy="86" r="9" fill="${skin}"/>`;
  if (p.ledge !== false) s += `<path d="M-6 98 H126"/>`;
  return `<svg width="${S}" height="${Math.round(S*94/120)}" viewBox="0 6 120 94" style="display:block;overflow:visible;flex:none" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">${s}</svg>`;
}
const charSVG = (look, mood, S) => look.gender ? guestSVG({...look, mood}, S) : critterSVG({...look, mood}, S);

/* ===================== LƯU TIẾN TRÌNH ===================== */
const KEY = "tiem-banh-matcha-v1";
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const DAY = 86400000;
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const fmtD = d => pad(d.getDate())+"/"+pad(d.getMonth()+1);
const rnd = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtN = n => n.toLocaleString("vi-VN");

function fresh(){
  return {
    v:2, coins:40, xp:0, decor:[], reviews:[], letters:[], served:0, shifts:0,
    names:{her:CFG.herName, his:CFG.hisName, girls:CFG.girlNames, boys:CFG.boyNames, pets:Object.fromEntries(CFG.pets.map(p=>[p.id,p.name]))},
    pets:Object.fromEntries(CFG.pets.map(p=>[p.id,{aff:0,petDay:"",pets:0,fedDay:""}])),
    daily:{day:""}, streak:0, lastDay:"", sound:true, music:true
  };
}
let S;
try { S = Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY)||"{}")); } catch(e){ S = fresh(); }
// Chuyển từ bản cũ: đồ trang trí cũ được hoàn tiền, đánh giá cũ (hình kiểu cũ) bỏ đi
if ((S.v||1) < 2){
  const OLD = {plant:60,lights:120,vase:180,frame:260,bell:350,bear:480,tea:650,ribbon:900};
  const refund = (S.decor||[]).reduce((a,id)=>a+(OLD[id]||0),0);
  S.coins += refund; S.decor = []; S.reviews = []; S.v = 2; S.refund = refund;
}
S.names = Object.assign(fresh().names, S.names||{});
["Bông","Mơ","Tuyết"].forEach((old,i)=>{ const id = CFG.pets[i].id; if (!S.names.pets[id] || S.names.pets[id]===old) S.names.pets[id] = CFG.pets[i].name; });
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const petName = id => S.names.pets[id] || CFG.pets.find(p=>p.id===id).name;
const nameList = s => { const l = String(s||"").split(",").map(x=>x.trim()).filter(Boolean); return l.length ? l : ["Khách"]; };

/* ===================== NGÀY ĐẶC BIỆT ===================== */
const daysTogether = () => Math.floor((today() - parse(CFG.metDate))/DAY) + 1;
function nextOn(m, d){
  const t = today(); let x = new Date(t.getFullYear(), m-1, d);
  if (x < t) x = new Date(t.getFullYear()+1, m-1, d);
  return x;
}
function fill(s, v){ return s.replace(/\{(\w+)\}/g, (_,k)=> v[k] ?? ""); }
function events(){
  const t = today(), met = parse(CFG.metDate), her = parse(CFG.herBirthday), his = parse(CFG.hisBirthday);
  const list = [];
  const an = nextOn(met.getMonth()+1, met.getDate());
  list.push({key:"anniversary", date:an, t:"Kỷ niệm "+(an.getFullYear()-met.getFullYear())+" năm yêu nhau", v:{n:an.getFullYear()-met.getFullYear()}});
  const hb = nextOn(her.getMonth()+1, her.getDate());
  list.push({key:"herBirthday", date:hb, t:"Sinh nhật "+S.names.her, v:{age:hb.getFullYear()-her.getFullYear()}});
  const sb = nextOn(his.getMonth()+1, his.getDate());
  list.push({key:"hisBirthday", date:sb, t:"Sinh nhật "+S.names.his, v:{age:sb.getFullYear()-his.getFullYear()}});
  // tròn tháng (ngày 10 hằng tháng), bỏ qua tháng trùng kỷ niệm năm
  let mo = new Date(t.getFullYear(), t.getMonth(), met.getDate());
  if (mo < t) mo = new Date(t.getFullYear(), t.getMonth()+1, met.getDate());
  const months = (mo.getFullYear()-met.getFullYear())*12 + mo.getMonth()-met.getMonth();
  if (months % 12) list.push({key:"monthly", date:mo, t:"Tròn "+months+" tháng", v:{n:months}});
  const dt = daysTogether(), nextHund = Math.ceil(dt/100)*100 || 100;
  list.push({key:"milestone", date:new Date(met.getTime() + (nextHund-1)*DAY), t:"Ngày thứ "+nextHund+" bên nhau", v:{}});
  list.push({key:"valentine", date:nextOn(2,14), t:"Valentine", v:{}});
  list.push({key:"women83", date:nextOn(3,8), t:"Quốc tế Phụ nữ 8/3", v:{}});
  list.push({key:"women2010", date:nextOn(10,20), t:"Phụ nữ Việt Nam 20/10", v:{}});
  list.forEach(e => { e.in = Math.round((e.date - t)/DAY); });
  return list.sort((a,b)=>a.in-b.in);
}
const todayEvents = () => events().filter(e => e.in === 0);
const coinMult = () => todayEvents().length ? 2 : 1;
function eventNote(e){
  return fill(CFG.eventNotes[e.key]||"", {...e.v, d:daysTogether(), her:S.names.her, his:S.names.his});
}

/* ===================== CẤP, MỤC TIÊU, HIỆU ỨNG ĐỒ ===================== */
const lvl = () => Math.min(99, Math.floor(Math.sqrt(S.xp/40)) + 1);
const xpFor = L => 40*(L-1)*(L-1);
const unlocked = () => RECIPES.filter(r => r.lv <= lvl());
function fx(k){ return S.decor.reduce((a,id)=> a + ((DECOR.find(x=>x.id===id)||{}).fx?.[k]||0), 0); }
function rollDay(){
  const t = ymd(today());
  if (S.daily.day !== t){
    S.daily = {day:t};
  }
  // bổ sung trường còn thiếu (ngày đang dở từ bản cũ)
  const u = unlocked();
  S.daily = Object.assign({served:0, earned:0, feat:0, angry:0, claimed:false, boy:false, featId:u[(daysTogether()-1) % u.length].id}, S.daily);
  ["served","earned","feat","angry"].forEach(k=>{ if (!Number.isFinite(S.daily[k])) S.daily[k] = 0; });
  if (S.lastDay !== t){
    const y = ymd(new Date(today()-DAY));
    S.streak = S.lastDay === y ? S.streak+1 : 1;
    S.lastDay = t;
  }
  save();
}
const featured = () => RECIPES.find(r=>r.id===S.daily.featId) || RECIPES[0];

/* ===================== MÀN CHƠI ===================== */
let SH = null, raf = 0, lastT = 0;
const B0 = () => ({base:null, cream:null, top:null, sweet:null});
const needOf = c => ({base:c.r.base, cream:c.r.cream, top:c.r.top, sweet:c.sweet});

function startShift(){
  const L = lvl();
  SH = { total: Math.min(16, 6+L+fx("cust")), spawned:0, served:0, left:0, coins:0, tips:0, stars:[],
    seats:[null,null,null], build:B0(), drop:null, t:0, next:1, paused:false, boyDone:!!S.daily.boy, petsDone:[], lv0:L, sel:-1, leftShown:-1 };
  scr = "play"; document.body.dataset.scr = "play";
  renderPlay();
  lastT = performance.now();
  cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
  sfx("open"); Sound.play("shift");
}

function makeGuest(){
  const girl = Math.random() < .5;
  return {who: pick(nameList(girl ? S.names.girls : S.names.boys)),
    look:{gender:girl?"girl":"boy", hairStyle: girl ? pick(["long","buns"]) : pick(["short","cap"]), hair:pick(HAIR), skin:pick(SKIN), accent:pick(ACCENT), gesture:pick(["rest","wave","cheek"])}};
}
function spawn(){
  const free = SH.seats.map((s,i)=>s?null:i).filter(i=>i!==null);
  if (!free.length) return;
  const i = free[0], L = lvl(), rs = unlocked();
  const sweetRoll = () => { const x = Math.random(); return x < .5 ? 0 : x < .8 ? 1 : 2; };
  const petChance = .1 + fx("pet") + CFG.pets.reduce((a,p)=>a+S.pets[p.id].aff,0)/1500;
  const petsLeft = CFG.pets.filter(p=>!SH.petsDone.includes(p.id));
  let c;
  if (!SH.boyDone && ((SH.spawned >= 2 && Math.random() < .35) || SH.spawned === SH.total-1)){
    SH.boyDone = true; S.daily.boy = true; save();
    c = {who:S.names.his, look:{...HIM}, him:true, r:RECIPES[0], sweet:0, max:70};
  } else if (petsLeft.length && Math.random() < petChance){
    const p = pick(petsLeft); SH.petsDone.push(p.id);
    c = {who:petName(p.id), look:{...PETS[p.id]}, pet:p.id, r:pick(rs), sweet:0, max:55};
  } else {
    const g = Math.random() < .6 ? makeGuest() : (k => ({who:k.n, look:{...k}}))(pick(CRITTERS));
    const r = Math.random() < .25 ? featured() : Math.random() < .3 ? rs[rs.length-1] : pick(rs);
    c = {...g, r: r.lv <= L ? r : pick(rs), sweet:sweetRoll(), max: Math.max(26, 44 - L*1.5) * (1+fx("pat"))};
  }
  c.pat = c.max;
  SH.seats[i] = c; SH.spawned++;
  renderSeat(i, true); sfx("bell");
}

function loop(now){
  const dt = Math.min(.1, (now-lastT)/1000); lastT = now;
  if (SH && !SH.paused){
    SH.t += dt;
    if (SH.spawned < SH.total && SH.t >= SH.next && SH.seats.some(s=>!s)){
      spawn(); SH.next = SH.t + rnd(2.5, 5.5) - Math.min(1.5, lvl()*.12);
    }
    SH.seats.forEach((c,i)=>{
      if (!c || c.gone) return;
      c.pat -= dt;
      const f = Math.max(0, c.pat/c.max), cls = f<.3 ? "low" : f<.6 ? "mid" : "";
      if (c.bar){
        c.bar.style.transform = `scaleX(${f.toFixed(3)})`;
        if (c.cls !== cls){
          c.cls = cls; c.bar.style.background = cls==="low" ? "#FF6F91" : cls==="mid" ? "#FFD66B" : "#8FD9B6";
          c.el.classList.toggle("low", cls==="low");
          if (cls==="low"){ c.mood = "impatient"; c.art.innerHTML = charSVG(c.look, "impatient", 84); }
        }
      }
      if (c.pat <= 0) leave(i);
    });
    const left = SH.total - SH.served - SH.left;
    if (SH.leftShown !== left){ SH.leftShown = left; const e = $("#shLeft"); if (e) e.textContent = `Ca ${S.shifts+1} · còn ${left} khách`; }
    if (SH.spawned >= SH.total && SH.seats.every(s=>!s)) return endShift();
  }
  raf = requestAnimationFrame(loop);
}

function renderPlay(){
  const L = lvl(), cur = S.xp - xpFor(L), need = xpFor(L+1) - xpFor(L);
  $("#app").innerHTML = `<div class="scr play">
    <div class="ptop">
      <div class="lv">Lv${L}</div>
      <div class="pbar"><small id="shLeft">Ca ${S.shifts+1} · còn ${SH.total} khách</small><div class="track"><i id="xpBar" style="width:${Math.min(100,cur/need*100)}%"></i></div></div>
      ${coinPill(true,"shCoins")}
      <button class="rbtn" data-act="pause" aria-label="Tạm dừng">❚❚</button>
    </div>
    <div class="lane">${[0,1,2].map(i=>`<div class="seat" id="seat${i}"></div>`).join("")}</div>
    <div class="ctr"></div>
    <div class="bench"><div id="cake"></div><div class="for" id="forBox"></div></div>
    <div class="sheet">
      ${KEYS.map(k=>`<div class="crow"><span>${LABELS[k]}</span><div class="g3">${CATS[k].map(([n,c],i)=>`<button class="chip ${k==="sweet"?"sq":""}" data-ing="${k}:${i}"><i style="background:${c}"></i>${n}<em></em></button>`).join("")}</div></div>`).join("")}
      <div class="grow" style="min-height:4px"></div>
      <button class="b3 give" id="give" data-act="serve">Giao bánh</button>

  SH.seats.forEach((_,i)=>renderSeat(i));

function renderSeat(i, enter){
  const el = $("#seat"+i); if (!el) return;
  const c = SH.seats[i];
  el.className = "seat" + (enter ? " enter" : "");
  if (!c){ el.innerHTML = ""; renderTarget(); return; }
  const f = c.pat/c.max;
  el.innerHTML = `<div class="burst"></div>
    <div class="ord"><div class="rn">${esc(c.r.n)}</div><div>${esc(partsText(c.r))}</div><div class="sw">${CATS.sweet[c.sweet][0]}</div></div>
    <div class="who-art"><button data-seat="${i}" aria-label="Làm bánh cho ${esc(c.who)}">${charSVG(c.look, c.mood||"happy", 84)}</button></div>
    <div class="pat"><i style="transform:scaleX(${f.toFixed(3)})"></i></div><div class="nm">${c.him?"♥︎ ":""}${esc(c.who)}</div>`;
  c.el = el; c.bar = el.querySelector(".pat i"); c.art = el.querySelector(".who-art button"); c.cls = "";
  renderTarget();
}

// khách đang làm bánh cho: khách được chạm, hoặc khách chờ lâu nhất
function targetIdx(){
  if (!SH) return -1;
  if (SH.sel>=0 && SH.seats[SH.sel] && !SH.seats[SH.sel].gone) return SH.sel;
  let best = -1;
  SH.seats.forEach((c,i)=>{ if (c && !c.gone && (best<0 || c.pat/c.max < SH.seats[best].pat/SH.seats[best].max)) best = i; });
  return best;
}
function renderTarget(){
  if (!SH || !$("#forBox")) return;
  const ti = targetIdx(), b = SH.build, c = ti>=0 ? SH.seats[ti] : null, n = c ? needOf(c) : null;
  SH.seats.forEach((_,k)=>{ const s = $("#seat"+k); s && s.classList.toggle("tgt", k===ti); });
  const made = recipeOf(b);
  $("#forBox").innerHTML = c
    ? `<small>Đang làm cho</small><b>${esc(c.who)}</b><div class="rc">${esc(c.r.n)}</div><div class="sw">${b.sweet!=null ? CATS.sweet[b.sweet][0] : "Chọn độ ngọt"}</div>`
    : `<small>Chờ khách vào tiệm…</small><b>${made ? esc(made.n) : "Đĩa trống"}</b>`;

const matches = (c,b) => c && !c.gone && KEYS.every(k=>needOf(c)[k]===b[k]);
function serve(){
  const b = SH.build;
  if (KEYS.some(k=>b[k]==null)) return toast("Chọn đủ Đế, Kem, Topping và Độ ngọt nha");
  const ti = targetIdx();
  let idx = matches(SH.seats[ti], b) ? ti : SH.seats.findIndex(c=>matches(c,b));
  if (idx<0){
    sfx("wrong");
    if (ti<0) return toast("Chưa có khách nào gọi món");
    const c = SH.seats[ti], n = needOf(c), bad = KEYS.find(k=>b[k]!==n[k]);
    return toast(`Sai ${LABELS[bad].toLowerCase()} rồi: ${c.who} gọi ${CATS[bad][n[bad]][0]}, không phải ${CATS[bad][b[bad]][0]}`);
  }
  const c = SH.seats[idx]; c.gone = true;
  const f = c.pat / c.max, s = f>.55 ? 3 : f>.3 ? 2 : 1, mult = coinMult();
  const price = Math.round(c.r.price * (1+fx("price"))) * mult, tip = Math.round(c.r.price * f * .6 * (1+fx("tip"))) * mult;
  S.coins += price + tip; SH.coins += price; SH.tips += tip; SH.served++; S.served++; SH.stars.push(s);
  S.xp += 4 + s*2;
  S.daily.served++; S.daily.earned += price + tip; if (c.r.id === S.daily.featId) S.daily.feat++;
  if (c.pet) S.pets[c.pet].aff += 2;
  addReview(c, s); save();
  // hiệu ứng: thẻ gọi món thành xanh, khách bắn tim, bánh nhắm mắt cười nhún nhảy
  const el = c.el;
  el.querySelector(".ord").outerHTML = `<div class="ord ok">+${s} ★ · +${price} xu${tip?` · tip ${tip}`:""}<small>${c.him?"Thương em!":"Cảm ơn nha!"}</small></div>`;
  c.art.innerHTML = charSVG(c.look, "love", 84);
  el.classList.remove("low");
  el.querySelector(".burst").innerHTML = Array.from({length:14},(_,i)=>{ const a = i/14*Math.PI*2, d = 55+(i%3)*20; return `<i style="font-size:${14+(i%3)*7}px;color:${["#FF8FAB","#FFC94D","#8FD9B6"][i%3]};--dx:${(Math.cos(a)*d).toFixed(1)}px;--dy:${(Math.sin(a)*d).toFixed(1)}px">${i%2?"♥︎":"✦"}</i>`; }).join("");
  const r = el.getBoundingClientRect(); floatText(r.left+r.width/2, r.top+60, "+"+(price+tip));
  sfx("coin");
  const cp = $("#shCoins"); cp.querySelector("span:last-child").textContent = fmtN(S.coins); cp.classList.remove("pulse"); void cp.offsetWidth; cp.classList.add("pulse");
  const L = lvl(); $("#xpBar").style.width = Math.min(100,(S.xp-xpFor(L))/(xpFor(L+1)-xpFor(L))*100)+"%";
  renderBuild(true);
  SH.sel = -1;
  const sh = SH;
  setTimeout(()=>{ if (SH!==sh) return; SH.build = B0(); renderBuild(); }, 900);
  setTimeout(()=>{ if (SH!==sh) return; el.classList.add("bye"); setTimeout(()=>{ if (SH!==sh) return; SH.seats[idx] = null; renderSeat(idx); }, 450); }, 1300);
  if (c.him) setTimeout(()=>{ if (SH===sh){ SH.paused = true; himNote(c); } }, 700);
}

}

// Nhạc nền + hiệu ứng tự tổng hợp bằng Web Audio: không cần file mp3, nhẹ và chạy offline.
const Sound = (() => {
  let ctx = null, master, musicBus, sfxBus, noiseBuf, timer = 0, track = null, want = null, step = 0, nextT = 0;
  const hz = m => 440 * Math.pow(2, (m-69)/12);
  const N = s => { // "A5" -> midi
    const m = /^([A-G])(#|b)?(\d)$/.exec(s); if (!m) return null;
    return {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]] + (m[2]==="#"?1:m[2]==="b"?-1:0) + (+m[3]+1)*12;
  };
  const mel = str => str.trim().split(/\s+/).map(x => x==="." ? null : N(x));

  // Hai bài: "Sáng ở tiệm" (hộp nhạc, chậm) và "Giờ cao điểm" (vui, nhanh)
  const TRACKS = {
    home: { bpm:84, vol:.55,
      chords:[[53,57,60],[50,53,57],[46,50,53],[48,52,55],[53,57,60],[45,48,52],[46,50,53],[48,52,55]],
      mel: mel(`A5 . C6 . A5 G5 F5 .  D5 . F5 . A5 . G5 .  F5 . D5 . F5 G5 A5 .  G5 . . E5 C5 . . .
                A5 . C6 . D6 C6 A5 .  C6 . A5 . E5 . G5 .  F5 G5 A5 . D5 . F5 .  E5 . G5 . F5 . . .`),
      lead:"box", bass:[0,4], pad:[2,6], hat:[] },
    shift: { bpm:112, vol:.5,
      chords:[[48,52,55],[45,48,52],[41,45,48],[43,47,50],[48,52,55],[40,43,47],[41,45,48],[43,47,50]],
      mel: mel(`E5 G5 . C6 . G5 E5 .  A5 . C6 . A5 G5 E5 .  F5 A5 . C6 . A5 F5 .  G5 . B5 . D6 . B5 .
                C6 . G5 . E5 G5 C6 .  B5 . G5 . E5 . G5 .  A5 G5 F5 . A5 . C6 .  D6 . B5 . G5 . . .`),
      lead:"pluck", bass:[0,3,4,6], pad:[2,6], hat:[1,3,5,7] }
  };

  function init(){
    if (ctx) return true;
    try {
      ctx = new (window.AudioContext||window.webkitAudioContext)();
      const comp = ctx.createDynamicsCompressor();
      master = ctx.createGain(); master.gain.value = .9;
      musicBus = ctx.createGain(); musicBus.gain.value = 0;
      sfxBus = ctx.createGain(); sfxBus.gain.value = .9;
      const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 4200;
      musicBus.connect(lp).connect(master); sfxBus.connect(master); master.connect(comp).connect(ctx.destination);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate*.3, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
      return true;
    } catch(e){ ctx = null; return false; }
  }

  // ---- nhạc cụ ----
  function tone(bus, type, f, t, dur, vol, att, f2){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur*.6);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + (att||.006));
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(bus); o.start(t); o.stop(t + dur + .05);
  }
  function musicBox(m, t, v){ const f = hz(m); tone(musicBus,"sine",f,t,1.3,.16*v); tone(musicBus,"sine",f*2,t,.5,.05*v); tone(musicBus,"triangle",f*3,t,.15,.015*v); }
  function pluck(m, t, v){ const f = hz(m); tone(musicBus,"triangle",f,t,.35,.14*v); tone(musicBus,"sine",f*2,t,.18,.04*v); }
  function hat(t, v){
    const s = ctx.createBufferSource(), hp = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; hp.type = "highpass"; hp.frequency.value = 7000;
    g.gain.setValueAtTime(.035*v, t); g.gain.exponentialRampToValueAtTime(.0001, t+.04);
    s.connect(hp).connect(g).connect(musicBus); s.start(t); s.stop(t+.05);
  }

  function schedule(){
    if (!ctx || !track) return;
    const T = TRACKS[track], dt = 60/T.bpm/2;
    while (nextT < ctx.currentTime + .15){
      const bar = Math.floor(step/8) % 8, pos = step % 8, ch = T.chords[bar], v = T.vol;
      const m = T.mel[(bar*8+pos) % T.mel.length];
      if (m) (T.lead==="box" ? musicBox : pluck)(m, nextT, v);
      if (T.bass.includes(pos)) tone(musicBus,"sine",hz(ch[0]-12),nextT,T.lead==="box"?.9:.3,.2*v,.01);
      if (T.pad.includes(pos)) ch.forEach((n,i)=> tone(musicBus,"triangle",hz(n+12),nextT+i*.02,.7,.035*v,.03));
      if (T.hat.includes(pos)) hat(nextT, v);
      step++; nextT += dt;
    }
  }

  function play(name){
    want = name;
    if (!S.music || !ctx || document.hidden) return;
    if (track === name) return;
    const now = ctx.currentTime;
    musicBus.gain.cancelScheduledValues(now);
    musicBus.gain.setValueAtTime(musicBus.gain.value, now);
    musicBus.gain.linearRampToValueAtTime(0, now + .35);
    setTimeout(() => {
      if (!S.music || want !== name) return;
      track = name; step = 0; nextT = ctx.currentTime + .05;
      const t = ctx.currentTime; musicBus.gain.setValueAtTime(0, t); musicBus.gain.linearRampToValueAtTime(1, t + 1.2);
      clearInterval(timer); timer = setInterval(schedule, 30); schedule();
    }, track ? 380 : 0);
  }
  function stop(){
    clearInterval(timer); timer = 0; track = null;
    if (ctx){ const t = ctx.currentTime; musicBus.gain.cancelScheduledValues(t); musicBus.gain.setValueAtTime(musicBus.gain.value,t); musicBus.gain.linearRampToValueAtTime(0,t+.3); }
  }

  // ---- hiệu ứng ----
  const SFX = {
    tap:    t => tone(sfxBus,"sine",620,t,.09,.18,.004,930),
    untap:  t => tone(sfxBus,"sine",520,t,.09,.14,.004,340),
    click:  t => tone(sfxBus,"triangle",1400,t,.04,.06),
    bell:   t => { tone(sfxBus,"sine",hz(84),t,.7,.16); tone(sfxBus,"sine",hz(79),t+.16,.9,.16); },
    coin:   t => { tone(sfxBus,"triangle",hz(88),t,.18,.16); tone(sfxBus,"triangle",hz(93),t+.07,.35,.16); tone(sfxBus,"sine",hz(100),t+.12,.3,.05); },
    wrong:  t => { tone(sfxBus,"square",hz(52),t,.14,.05); tone(sfxBus,"square",hz(49),t+.12,.22,.05); },
    leave:  t => tone(sfxBus,"sine",440,t,.45,.14,.01,190),
    boop:   t => { tone(sfxBus,"sine",660,t,.12,.14,.005,1100); tone(sfxBus,"sine",hz(88),t+.08,.18,.05); },
    trash:  t => { const s = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = noiseBuf; bp.type="bandpass"; bp.frequency.setValueAtTime(2500,t); bp.frequency.exponentialRampToValueAtTime(400,t+.2); g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.22); s.connect(bp).connect(g).connect(sfxBus); s.start(t); s.stop(t+.25); },
    open:   t => [72,76,79,84].forEach((m,i)=> tone(sfxBus,"triangle",hz(m),t+i*.08,.4,.12)),
    level:  t => [72,76,79,84,88,91].forEach((m,i)=> tone(sfxBus,"triangle",hz(m),t+i*.07,.5,.12)),
    letter: t => [65,69,72,77,81,84,89].forEach((m,i)=> tone(sfxBus,"sine",hz(m),t+i*.06,1.1,.08)),
    end:    t => [79,76,72,74,72].forEach((m,i)=> tone(sfxBus,"triangle",hz(m),t+i*.12,.5,.1))
  };
  function sfx(name){
    if (!S.sound || !ctx || ctx.state !== "running") return;
    try { SFX[name] && SFX[name](ctx.currentTime + .005); } catch(e){}
  }

  // Trình duyệt chỉ cho phát tiếng sau khi người chơi chạm lần đầu
  function unlock(){
    if (!init()) return;
    if (ctx.state === "suspended") ctx.resume();
    if (want) play(want);
  }
  document.addEventListener("pointerdown", unlock, {passive:true});
  document.addEventListener("keydown", unlock);
  document.addEventListener("visibilitychange", () => {
    if (!ctx) return;
    if (document.hidden){ clearInterval(timer); timer = 0; ctx.suspend(); }
    else { ctx.resume().then(()=>{ if (track && S.music){ nextT = ctx.currentTime + .05; clearInterval(timer); timer = setInterval(schedule, 30); } else if (want) play(want); }); }
  });
  return { play, stop, sfx, setMusic(on){ S.music = on; save(); on ? (unlock(), play(want||"home")) : stop(); } };
})();
const sfx = n => Sound.sfx(n);

let toastT;

  clearTimeout(toastT);
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div"); t.className = "toast"; t.textContent = m;
  document.body.appendChild(t); toastT = setTimeout(()=>t.remove(), 3200);
}
function floatHearts(x, y, n){
  for (let i=0;i<n;i++){
    const h = document.createElement("div"); h.className = "fh";
    h.textContent = pick(["♥︎","✦","♥︎"]); h.style.color = pick(["#FF8FAB","#FFC94D","#8FD9B6","#FF6F91"]);

}

  if (!l){
    const te = todayEvents();
    l = te.length ? {day, txt:eventNote(te[0]), tag:te[0].t} : {day, txt:CFG.notes[(daysTogether()-1) % CFG.notes.length]};

function claimGoals(){
  if (!giftReady()) return;
  S.daily.claimed = true; S.coins += 60;
  const used = new Set(S.letters.map(l=>l.txt));

  S.letters.push({day:S.daily.day, txt, tag:"Thư bí mật", bonus:true}); save();
  const back = scr === "result" ? ()=>{ const b = document.querySelector(".unlock"); if (b) b.outerHTML = `<div class="unlock"><div class="env"></div><div><b>Đã mở thư tình hôm nay</b><small>Đọc lại ở mục Quà tặng</small></div></div>`; } : render;
  modal(`<h2>Xong hết mục tiêu rồi!</h2><p class="sub">+60 xu và một lá thư bí mật</p>

  floatHearts(innerWidth/2, innerHeight/2, 10); sfx("level");
}

  modal(`<h2>Cài đặt tiệm</h2>
    <form id="setForm">
      <label class="field">Tên chủ tiệm (bạn nữ)<input id="fHer" value="${esc(S.names.her)}" maxlength="20"></label>
      <label class="field">Tên người gửi thư (bạn nam)<input id="fHis" value="${esc(S.names.his)}" maxlength="20"></label>
      ${CFG.pets.map(p=>`<label class="field">Tên bé ${p.id==="dog"?"cún trắng":p.id==="gold"?"mèo vàng":"mèo trắng"}<input id="fPet_${p.id}" value="${esc(petName(p.id))}" maxlength="16"></label>`).join("")}
      <label class="field">Tên khách nữ (${nameList(S.names.girls).length}) · cách nhau bằng dấu phẩy<textarea id="fGirls" rows="2">${esc(S.names.girls)}</textarea></label>
      <label class="field">Tên khách nam (${nameList(S.names.boys).length})<textarea id="fBoys" rows="2">${esc(S.names.boys)}</textarea></label>
      <label class="tg"><input id="fMusic" type="checkbox" ${S.music?"checked":""}>Nhạc nền</label>
      <label class="tg"><input id="fSound" type="checkbox" ${S.sound?"checked":""}>Hiệu ứng âm thanh</label>
      <div class="mbtns"><button class="b3" type="submit">Lưu</button><button class="b3 w" type="button" id="resetBtn" style="font-size:16px;color:var(--red)">Chơi lại từ đầu</button></div>
    </form>`, render);
  $("#setForm").addEventListener("submit", e=>{
    e.preventDefault();
    const v = id => $(id).value.trim();
    S.names.her = v("#fHer") || CFG.herName; S.names.his = v("#fHis") || CFG.hisName;
    S.names.girls = v("#fGirls") || CFG.girlNames; S.names.boys = v("#fBoys") || CFG.boyNames;
    CFG.pets.forEach(p=> S.names.pets[p.id] = v("#fPet_"+p.id) || p.name);
    S.sound = $("#fSound").checked; const m = $("#fMusic").checked; if (m !== S.music) Sound.setMusic(m);
    save(); closeModal(); toast("Đã lưu");
  });
  $("#resetBtn").addEventListener("click", e=>{
    if (!resetArm){ resetArm = true; e.target.textContent = "Bấm lần nữa để xoá hết tiến trình"; return; }
    S = fresh(); save(); closeModal(); toast("Đã chơi lại từ đầu");
  });
}

/* ===================== CHẠM ===================== */
document.addEventListener("click", e=>{
  const t = e.target.closest("button, .modal"); if (!t) return;
  if (t.id==="modal"){ if (e.target===t && !SH) closeModal(); return; }
  if (t.hasAttribute("data-close")) return closeModal();
  if (t.hasAttribute("data-music")){ Sound.setMusic(!S.music); if (scr==="home") render(); return; }
  if (t.dataset.go){ sfx("click"); return go(t.dataset.go, t.dataset.tab); }
  if (t.dataset.tabOnly){ sfx("click"); shopTab = t.dataset.tabOnly; return render(); }
  const act = t.dataset.act;
  if (act==="open"){ $("#layer").innerHTML = ""; onClose = null; return startShift(); }
  if (act==="letter") return openLetter();
  if (act==="claim") return claimGoals();
  if (act==="settings") return settings();
  if (act==="pause") return pauseMenu();
  if (act==="serve") return serve();
  if (t.dataset.buy){
    const d = DECOR.find(x=>x.id===t.dataset.buy);
    if (S.coins < d.cost || S.decor.includes(d.id) || d.lv > lvl()) return;
    S.coins -= d.cost; S.decor.push(d.id); save(); render(); sfx("level"); toast("Đã mua "+d.n);
    return;
  }
  if (t.dataset.pet){
    const id = t.dataset.pet, st = S.pets[id], r = t.getBoundingClientRect();
    if (st.petDay !== S.daily.day){ st.petDay = S.daily.day; st.pets = 0; }
    if (st.pets < 10){ st.pets++; st.aff++; save(); }
    floatHearts(r.left+r.width/2, r.top+r.height/3, 3); sfx("boop");
    t.classList.remove("squish"); void t.offsetWidth; t.classList.add("squish");
    const h = document.querySelector(`[data-hearts="${id}"]`); if (h) h.textContent = hearts(st.aff);
    return;
  }
  if (t.dataset.feed){
    const st = S.pets[t.dataset.feed];
    if (st.fedDay === S.daily.day || S.coins < 5) return;
    S.coins -= 5; st.fedDay = S.daily.day; st.aff += 5; save();
    const r = t.getBoundingClientRect(); floatHearts(r.left+r.width/2, r.top, 5); sfx("boop");
    toast(petName(t.dataset.feed)+" ăn ngon lành!"); render(); return;
  }
  if (!SH) return;
  if (t.dataset.ing){
    const [k,i] = t.dataset.ing.split(":"), add = SH.build[k] !== +i;
    SH.build[k] = add ? +i : null; SH.drop = add && k!=="sweet" ? k : null;
    renderBuild(); sfx(add?"tap":"untap"); return;
  }
  if (t.dataset.seat){ const i = +t.dataset.seat; SH.sel = SH.sel===i ? -1 : i; renderTarget(); sfx("click"); return; }
});
document.addEventListener("visibilitychange", ()=>{ if (document.hidden && SH && !SH.paused && !$("#modal")) pauseMenu(); });

rollDay();
render();
Sound.play("home");
if (S.refund){ const r = S.refund; delete S.refund; save(); setTimeout(()=>toast(`Tiệm đổi giao diện mới! Hoàn lại ${r} xu cho đồ trang trí cũ`), 600); }
</script>
